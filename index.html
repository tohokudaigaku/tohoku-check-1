<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東北大学付けチェック</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:sans-serif;
}

.question{
    text-align:center;
    font-size:2rem;
    font-weight:bold;
    margin-bottom:20px;
}

.choice{
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    text-align:center;
}

.a{
    background:#1976d2;
}

.b{
    background:#d32f2f;
}

.label{
    font-size:2rem;
    font-weight:bold;
    margin-bottom:10px;
}

img{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:10px;
}

.text{
    font-size:1.5rem;
    padding:20px 0;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
}

.prev{
    background:#666;
    color:white;
}

.list{
    background:#ff9800;
    color:white;
}

.next{
    background:#28a745;
    color:white;
}

#listPage{
    display:none;
}

.item{
    background:#333;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:center;
    cursor:pointer;
}

.item:hover{
    background:#555;
}
</style>
</head>

<body>

<div id="questionPage">

<div id="questionNumber" class="question"></div>

<div class="choice a">
    <div class="label">A</div>
    <div id="choiceA"></div>
</div>

<div class="choice b">
    <div class="label">B</div>
    <div id="choiceB"></div>
</div>

<div class="buttons">
    <button class="prev" onclick="prevQuestion()">前へ</button>
    <button class="list" onclick="showList()">問題一覧</button>
    <button class="next" onclick="nextQuestion()">次へ</button>
</div>

</div>

<div id="listPage">

<h2>問題一覧</h2>

<div class="item" onclick="goQuestion(0)">第1問</div>
<div class="item" onclick="goQuestion(1)">第2問</div>
<div class="item" onclick="goQuestion(2)">第4問</div>
<div class="item" onclick="goQuestion(3)">第6問</div>
<div class="item" onclick="goQuestion(4)">第7問</div>

<button class="list" onclick="backQuestion()">
戻る
</button>

</div>
